[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windstorm"
version = "0.1.0"
description = "A miniature European windstorm hazard model built from ERA5 reanalysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "George Pindar" }]
dependencies = ["numpy", "scipy", "xarray", "netCDF4", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
